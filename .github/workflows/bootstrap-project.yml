name: Publish localized SMILEGUN v2 source
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part-* | base64 -d > /tmp/smilegun.zip
          work="$(mktemp -d)"
          unzip -q /tmp/smilegun.zip -d "$work"
          shopt -s dotglob
          cp -a "$work/smilegun/." .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish localized SMILEGUN v2 source"
          git push
