name: Publish localized SMILEGUN v2

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part-* | base64 -d > /tmp/smilegun-source.zip
          unzip -t /tmp/smilegun-source.zip
          work="$(mktemp -d)"
          unzip -q /tmp/smilegun-source.zip -d "$work"
          shopt -s dotglob
          cp -a "$work/smilegun/." .

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate local sound assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "scipy>=1.13,<1.17"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python generate_sound.py --ensure

      - name: Generate documentation screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          python -m http.server 8000 >/tmp/smilegun-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          npx --yes playwright@1.55.0 install --with-deps chromium
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,900" --wait-for-timeout=1200 "http://127.0.0.1:8000/templates/index.html?demo=menu&lang=ru" docs/screenshots/menu-ru.jpg
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,900" --wait-for-timeout=1200 "http://127.0.0.1:8000/templates/index.html?demo=targets&lang=ru" docs/screenshots/level-1-targets.jpg
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,900" --wait-for-timeout=1200 "http://127.0.0.1:8000/templates/index.html?demo=galaxy&lang=ru" docs/screenshots/level-2-galaxy.jpg
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,900" --wait-for-timeout=1200 "http://127.0.0.1:8000/templates/index.html?demo=dodge&lang=ru" docs/screenshots/level-3-dodge.jpg
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,900" --wait-for-timeout=1200 "http://127.0.0.1:8000/templates/index.html?demo=side&lang=ru" docs/screenshots/level-4-side.jpg

      - name: Regression checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          node test_frontend.cjs

      - name: Publish project tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish multilingual SMILEGUN v2 with screenshots and audio"
          git push
